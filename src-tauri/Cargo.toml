[package]
name = "keymind"
version = "0.1.0"
description = "Offline desktop touch-typing trainer with an adaptive training engine"
authors = ["Andrii Demchuk"]
license = "MIT"
repository = "https://github.com/andr77eeeew/keymind"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "keymind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.clippy]
# Project rule: no unwrap or expect outside tests (allowed there by clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
