[package]
name = "keymind"
version = "0.1.0"
description = "Offline desktop touch-typing trainer with an adaptive training engine"
authors = ["Andrii Demchuk"]
license = "MIT"
repository = "https://github.com/andr77eeeew/keymind"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "keymind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
# A seeded generator whose output is fixed by its specification, so journal seeds stay valid.
rand_chacha = "0.10"
# EPUB is a ZIP file. Only deflate is needed, which keeps the dependency tree small.
zip = { version = "9", default-features = false, features = ["deflate"] }
# EPUB metadata and chapters are XML. The `epub` crate is GPL-3.0, so it cannot be used here.
quick-xml = "0.42"
# Splits accented letters from their marks, so imported text can be typed on the layout.
unicode-normalization = "0.1"

[lints.clippy]
# Project rule: no unwrap or expect outside tests (allowed there by clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
